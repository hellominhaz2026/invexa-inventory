{% extends "base.html" %}
{% set active_page = 'customers' %}
{% block title %}Add customer{% endblock %}
{% block page_title %}Add customer{% endblock %}

{% block content %}
<div class="card" style="max-width:640px;">
  <div class="card-body">
    <form method="POST">
      <div class="field">
        <label for="name">Customer name</label>
        <input type="text" id="name" name="name" value="{{ form.name or '' }}" required autofocus>
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" value="{{ form.phone or '' }}">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ form.email or '' }}">
        </div>
      </div>
      <div class="field">
        <label for="address">Address</label>
        <textarea id="address" name="address">{{ form.address or '' }}</textarea>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Save customer</button>
        <a class="btn btn-ghost" href="{{ url_for('customers') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% set active_page = 'products' %}
{% block title %}Add product{% endblock %}
{% block page_title %}Add product{% endblock %}
{% block page_sub %}<p>Add a new SKU to the catalog</p>{% endblock %}

{% block content %}
<div class="card" style="max-width:720px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="field" style="grid-column:1 / -1;">
          <label for="name">Product name</label>
          <input type="text" id="name" name="name" value="{{ form.name or '' }}" placeholder="e.g. Wireless Mouse" required autofocus>
        </div>

        <div class="field">
          <label for="category_id">Category</label>
          <select id="category_id" name="category_id">
            <option value="">Uncategorized</option>
            {% for c in categories %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field">
          <label for="supplier">Supplier</label>
          <input list="supplier-list" id="supplier" name="supplier" value="{{ form.supplier or '' }}" placeholder="Supplier name">
          <datalist id="supplier-list">
            {% for s in suppliers %}<option value="{{ s.name }}">{% endfor %}
          </datalist>
        </div>

        <div class="field">
          <label for="purchase_price">Purchase price <span class="hint">৳ cost per unit</span></label>
          <input class="input-money" type="number" step="0.01" min="0" id="purchase_price" name="purchase_price" value="{{ form.purchase_price or '' }}" required>
        </div>

        <div class="field">
          <label for="selling_price">Selling price <span class="hint">৳ per unit</span></label>
          <input class="input-money" type="number" step="0.01" min="0" id="selling_price" name="selling_price" value="{{ form.selling_price or '' }}" required>
        </div>

        <div class="field">
          <label for="quantity">Opening quantity</label>
          <input class="input-money" type="number" step="1" min="0" id="quantity" name="quantity" value="{{ form.quantity or 0 }}" required>
        </div>

        <div class="field">
          <label for="minimum_stock">Minimum stock <span class="hint">low-stock alert threshold</span></label>
          <input class="input-money" type="number" step="1" min="0" id="minimum_stock" name="minimum_stock" value="{{ form.minimum_stock or 5 }}" required>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Save product</button>
        <a class="btn btn-ghost" href="{{ url_for('products') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

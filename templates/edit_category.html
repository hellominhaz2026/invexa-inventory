{% extends "base.html" %}
{% set active_page = 'categories' %}
{% block title %}Edit category{% endblock %}
{% block page_title %}Edit category{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-body">
    <form method="POST">
      <div class="field">
        <label for="name">Category name</label>
        <input type="text" id="name" name="name" value="{{ category.name }}" required autofocus>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a class="btn btn-ghost" href="{{ url_for('categories') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
